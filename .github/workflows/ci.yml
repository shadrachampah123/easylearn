name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - arena/dc9adcab-easylearn

jobs:
  quality:
    name: Tests, PostgreSQL isolation, typecheck, build, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: easylearn_test
          POSTGRES_PASSWORD: easylearn_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easylearn_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # These are disposable CI-only credentials. DB tests create and drop isolated scratch DBs.
      TEST_DATABASE_URL: postgres://easylearn_test:easylearn_test@127.0.0.1:5432/postgres
      # Pure tests/build must not inherit the PostgreSQL service as the application DB.
      DATABASE_URL: postgres://test:test@127.0.0.1:1/testdb
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate a random JWT secret for this run
        # The JWT secret policy rejects placeholder and low-entropy values, so CI uses a
        # freshly generated random secret instead of a published example. This also
        # proves the application works with a real random secret.
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Verify the generated JWT secret satisfies the secret policy
        run: npm run security:check-secret
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Require disposable PostgreSQL configuration
        run: test -n "$TEST_DATABASE_URL"
      - name: Unit and source-security tests
        run: npm test
      # Guards the af4fd93 production login outage: a prerendered interactive route
      # carries no CSP nonce, so 'strict-dynamic' blocks every chunk and the page
      # never hydrates. Fast, no build/server/database required.
      - name: CSP nonce / dynamic-rendering invariants
        run: npm run test:csp-hydration
      - name: Authentication security suites (JWT secret policy, CSRF, cookie auth)
        run: npm run test:auth-security
      - name: End-to-end PostgreSQL TLS tests (TLS-enabled PostgreSQL 16 required)
        env:
          # A skip must fail this job: the end-to-end TLS assertions have to actually run.
          EASY_LEARN_REQUIRE_TLS_E2E: "true"
        run: npm run test:tls-e2e
      - name: Database, migration, and membership suites (PostgreSQL required)
        env:
          # A skip must fail this job: the assignment schema-prerequisite assertions have to
          # actually run.
          EASY_LEARN_REQUIRE_ASSIGNMENT_PREREQ: "true"
          EASY_LEARN_REQUIRE_SCRATCH_DB_LIFECYCLE: "true"
          # A skip must fail this job: the seed-membership assertions have to actually run.
          EASY_LEARN_REQUIRE_SEED_MEMBERSHIP: "true"
          # A skip must fail this job: the seed-atomicity assertions have to actually run.
          EASY_LEARN_REQUIRE_SEED_ATOMICITY: "true"
          # A skip must fail this job (PR #66): the drift-remediation rehearsal, the health
          # session-revocation probe/route suites and the four session-revocation suites must
          # actually run — they previously skipped (exit 0) without TEST_DATABASE_URL.
          EASY_LEARN_REQUIRE_DRIFT_REHEARSAL: "true"
          EASY_LEARN_REQUIRE_HEALTH_SESSION_PROBE: "true"
          EASY_LEARN_REQUIRE_HEALTH_SESSION_ROUTE: "true"
          EASY_LEARN_REQUIRE_SESSION_REVOCATION_DB: "true"
          # A skip must fail this job: the embedded-PostgreSQL lifecycle hygiene
          # assertions (confirmed shutdown, no orphan postmasters, no leftover data
          # dirs) have to actually run.
          EASY_LEARN_REQUIRE_EMBEDDED_PG_LIFECYCLE: "true"
          # A skip must fail this job (H-1, 2026-11-19): the login-throttle regressions —
          # fail-closed on a database error, per-source budgets, and "an attacker cannot
          # lock an administrator out" — have to actually run.
          EASY_LEARN_REQUIRE_LOGIN_RATE_LIMIT_DB: "true"
          # A skip must fail this job (second review round, 2026-11-19): the Production pool
          # shape (max: 2) regressions — bounded advisory-lock waits, a backend killed
          # mid-transaction, and the M-R2 budgets under 200-way concurrency — have to run.
          EASY_LEARN_REQUIRE_PRODUCTION_POOL_DB: "true"
          # A skip must fail this job (post-deployment H-2 review, 2026-11-19): the
          # /api/health migration-progress reporting (0018 composite tenant FK counts)
          # has to actually run against a database.
          EASY_LEARN_REQUIRE_HEALTH_MIGRATION_DETAIL: "true"
        run: npm run test:db
      - name: Migration runner advisory-lock serialization (isolated PostgreSQL required)
        env:
          EASY_LEARN_REQUIRE_MIGRATION_RUNNER_LOCK: "true"
        run: node tests/migration-runner-advisory-lock.test.js
      - name: Tenant authorization suites (PostgreSQL required)
        run: npm run test:tenant-auth
      - name: "PR #45 reviewer regressions (PostgreSQL required)"
        # Independent reproductions of the PR #45 review findings R1-R7, authored by the
        # reviewer rather than by the remediation author. Kept as a separate step so a
        # failure points straight at the reviewer oracle. test:review-pr45 sets
        # EASY_LEARN_TEST_DATABASE itself and runs the CSRF file in its own process,
        # because that file mutates process.env at module load.
        run: npm run test:review-pr45
      - name: Tenant negative mutation tests
        run: npm run test:mutation
      - name: PR integration regression suite (PostgreSQL required)
        run: npm run test:integration
      - name: Tenant constraint integrity / schema-sync bypass regression (PostgreSQL required)
        env:
          # A skip must fail this job: the schema-sync bypass regression has to actually run.
          EASY_LEARN_REQUIRE_TENANT_INTEGRITY: "true"
        run: npm run test:tenant-integrity
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
