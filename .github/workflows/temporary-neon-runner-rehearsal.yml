name: Temporary Neon migration-runner rehearsal

on:
  push:
    branches:
      - test/runner-rehearsal-empty-db

permissions:
  contents: read

concurrency:
  group: easylearn-runner-rehearsal
  cancel-in-progress: false

jobs:
  migration-runner:
    name: Fresh database migration runner and checksum ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.EASY_LEARN_RUNNER_REHEARSAL_DATABASE_URL }}
    steps:
      - name: Check out isolated rehearsal branch
        uses: actions/checkout@v5
      - name: Require the temporary Neon secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add repository secret EASY_LEARN_RUNNER_REHEARSAL_DATABASE_URL using the connection string for the temporary empty Neon project, then rerun this workflow."
            exit 1
          fi
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run EasyLearn migration runner on the empty rehearsal database
        env:
          EASY_LEARN_TEST_DATABASE: "true"
        run: node run-migration.js
      - name: Verify runner lock serialization, termination, and recovery
        env:
          EASY_LEARN_TEST_DATABASE: "true"
        run: |
          node <<'NODE'
          const { Client } = require("pg");
          const { spawn } = require("node:child_process");
          const { randomUUID } = require("node:crypto");

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const key = [1163416649, 1296125510];

          function taggedDatabaseUrl(tag) {
            const url = new URL(process.env.DATABASE_URL);
            url.searchParams.set("application_name", tag);
            return url.toString();
          }

          function startRunner(tag) {
            const child = spawn(process.execPath, ["run-migration.js"], {
              cwd: process.cwd(),
              env: { ...process.env, DATABASE_URL: taggedDatabaseUrl(tag) },
              stdio: ["ignore", "pipe", "pipe"],
            });
            let stdout = "";
            let stderr = "";
            child.stdout.on("data", (chunk) => { stdout += chunk.toString(); });
            child.stderr.on("data", (chunk) => { stderr += chunk.toString(); });
            const done = new Promise((resolve) => {
              child.on("close", (code, signal) => resolve({ code, signal, stdout, stderr }));
            });
            return { child, done, tag };
          }

          async function inspectRunner(client, tag) {
            const result = await client.query(
              `SELECT application_name, state, wait_event_type, wait_event, query
                 FROM pg_stat_activity
                WHERE datname = current_database()
                  AND application_name = $1`,
              [tag]
            );
            return result.rows[0] || null;
          }

          async function waitForRunnerState(client, tag, predicate, description) {
            let last = null;
            for (let attempt = 0; attempt < 150; attempt += 1) {
              last = await inspectRunner(client, tag);
              if (last && predicate(last)) return last;
              await sleep(100);
            }
            throw new Error(`Timed out waiting for ${description}; last connection state: ${JSON.stringify(last)}`);
          }

          (async () => {
            const blocker = new Client({
              connectionString: process.env.DATABASE_URL,
              application_name: `runner-rehearsal-blocker-${randomUUID()}`,
            });
            blocker.on("error", () => {});
            await blocker.connect();
            let held = false;
            let first;
            let second;
            try {
              await blocker.query("SELECT pg_advisory_lock($1, $2)", key);
              held = true;

              first = startRunner(`runner-rehearsal-first-${randomUUID()}`);
              const firstState = await waitForRunnerState(
                blocker, first.tag,
                (row) => row.wait_event_type === "Lock" && row.wait_event === "advisory",
                "the first runner to wait on the advisory lock"
              );

              second = startRunner(`runner-rehearsal-second-${randomUUID()}`);
              const secondState = await waitForRunnerState(
                blocker, second.tag,
                (row) => row.wait_event_type === "Lock" && row.wait_event === "advisory",
                "the second runner to wait on the advisory lock"
              );

              console.log(`Observed first runner blocked: ${firstState.wait_event_type}/${firstState.wait_event}`);
              console.log(`Observed second runner blocked: ${secondState.wait_event_type}/${secondState.wait_event}`);

              first.child.kill("SIGTERM");
              const firstResult = await first.done;
              if (firstResult.signal !== "SIGTERM") {
                throw new Error(`Expected the waiting runner to terminate by SIGTERM; got code=${firstResult.code}, signal=${firstResult.signal}`);
              }

              await blocker.query("SELECT pg_advisory_unlock($1, $2)", key);
              held = false;

              const secondResult = await second.done;
              if (secondResult.code !== 0) {
                throw new Error(`Surviving runner failed (code=${secondResult.code}): ${secondResult.stderr.slice(-3000)}`);
              }

              const final = startRunner(`runner-rehearsal-final-${randomUUID()}`);
              const finalResult = await final.done;
              if (finalResult.code !== 0) {
                throw new Error(`Runner did not recover/idempotently complete after termination (code=${finalResult.code}): ${finalResult.stderr.slice(-3000)}`);
              }

              console.log("PASS: two runners serialized behind the advisory lock.");
              console.log("PASS: a waiting runner was terminated without blocking the surviving runner.");
              console.log("PASS: the surviving and subsequent runner completed successfully.");
            } finally {
              if (held) await blocker.query("SELECT pg_advisory_unlock($1, $2)", key).catch(() => {});
              await blocker.end().catch(() => {});
              for (const runner of [first, second]) {
                if (runner && runner.child.exitCode === null && runner.child.signalCode === null) {
                  runner.child.kill("SIGKILL");
                  await runner.done;
                }
              }
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
